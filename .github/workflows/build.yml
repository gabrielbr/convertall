name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
      - name: Package
        run: cd build && ditto -c -k --keepParent ConvertAll.app ConvertAll.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertAll
          path: build/ConvertAll.zip

  linux-core:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Test core (codecs, search, naming)
        run: swift test
