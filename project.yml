# Xcode project for release builds (generated with XcodeGen; not checked in).
# Xcode adds what SwiftPM can't: App Intents metadata for Shortcuts and the Finder menu
# extension (FinderMenu.appex).
#   brew install xcodegen && xcodegen generate
name: ConvertAll
options:
  # Readable by Xcode 15 (the CI image); newer XcodeGen defaults to Xcode 16's format.
  projectFormat: xcode15_0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    # Build number (CFBundleVersion); CI passes its run number.
    CURRENT_PROJECT_VERSION: "1"
packages:
  ConvertAllKit:
    path: .
schemes:
  # Not "ConvertAll": the Swift package already has an executable scheme by that name.
  ConvertAllApp:
    build:
      targets:
        ConvertAllApp: all
targets:
  ConvertAllApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/ConvertAll
      - path: Support/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ConvertAll
        PRODUCT_MODULE_NAME: ConvertAllApp
        PRODUCT_BUNDLE_IDENTIFIER: app.convertall.ConvertAll
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: ConvertAllKit
        product: ConvertAllCore
      # Helper tools belong in Contents/Helpers: code in Contents/MacOS is sealed as part
      # of the app itself, which breaks a separately signed tool's signature.
      - target: convertall
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: FinderMenu
        embed: true
  FinderMenu:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/FinderSync
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_NAME: FinderMenu
        PRODUCT_BUNDLE_IDENTIFIER: app.convertall.ConvertAll.FinderMenu
        INFOPLIST_FILE: Extensions/FinderSync/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/FinderSync/FinderSync.entitlements
        SKIP_INSTALL: YES
  convertall:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ConvertAllCLI
    settings:
      base:
        PRODUCT_NAME: convertall
        SKIP_INSTALL: YES
    dependencies:
      - package: ConvertAllKit
        product: ConvertAllCore
